name: Render token heatmap

# Optional: this workflow only re-renders the SVG from a committed
# `docs/token-usage.json`. The collector runs on the machine that owns the
# session logs; it does not run here. Repositories without a committed ledger
# skip every step, so this file is safe to ship as a template.

on:
  push:
    paths:
      - 'docs/token-usage.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Render
        run: |
          if [ ! -f docs/token-usage.json ]; then
            echo "no committed ledger; nothing to render"
            exit 0
          fi
          node src/cli.js render --from docs/token-usage.json --out docs
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/token-heatmap.svg docs/token-heatmap-dark.svg
          git commit -m "chore(token-heatmap): render $(date -u +%F)"
          git push
